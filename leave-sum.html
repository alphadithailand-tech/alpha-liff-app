<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="txt-title">ตรวจสอบสิทธิการลาคงเหลือ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#0056D2', dark: '#003DA5', light: '#EBF3FE' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-bg-header {
            background-image: url('https://lh3.googleusercontent.com/d/1tz1pXJinc7G0pVo3GHDnq6ZKKtrw7tq5');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-start sm:items-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:max-h-[900px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
        
        <!-- HEADER PROFILE -->
        <div class="custom-bg-header text-white px-5 pt-4 pb-6 rounded-b-3xl shadow-lg relative">
            <div class="flex items-center justify-between mb-3">
                <!-- ปุ่มย้อนกลับ -->
                <button onclick="goBack()" class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium bg-black/40 text-white backdrop-blur-md border border-white/20">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span id="txt-back">เมนูหลัก</span>
                </button>

                <!-- ปุ่มสลับภาษา -->
                <div class="inline-flex bg-black/40 backdrop-blur-md rounded-full p-1 border border-white/20">
                    <button id="lang-th-btn" onclick="switchLanguage('th')" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white text-slate-900 shadow-sm">TH</button>
                    <button id="lang-jp-btn" onclick="switchLanguage('jp')" class="px-2.5 py-0.5 rounded-full text-xs font-medium text-white">日本語</button>
                </div>
            </div>

            <!-- Profile Info -->
            <div class="flex items-center space-x-3">
                <img id="user-avatar" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-full object-cover border-2 border-white/80 shadow-md">
                <div>
                    <h2 id="emp-name" class="text-base font-bold text-white tracking-tight">กำลังโหลด...</h2>
                    <p class="text-xs text-white/90"><span id="txt-emp-id">รหัส</span>: <strong id="emp-id">-</strong> | <span id="txt-dept">แผนก</span>: <span id="emp-department">-</span></p>
                </div>
            </div>
        </div>

        <!-- CONTENT: 11 LEAVE QUOTAS -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 pb-8">
            <div class="flex items-center justify-between px-1">
                <h3 id="txt-subtitle" class="text-xs font-bold text-slate-500 uppercase tracking-wider">สิทธิการลาคงเหลือทั้งหมด (11 ประเภท)</h3>
                <span class="text-xs text-slate-400">ปี 2026</span>
            </div>

            <!-- Container สำหรับแสดงการ์ดโควตา 11 ประเภท -->
            <div id="quota-cards-container" class="space-y-2.5">
                <!-- Javascript จะ gen การ์ดมาใส่ตรงนี้ -->
            </div>
        </div>

    </div>

    <script>
        const LIFF_ID = "2012053598-ClINT0ab";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwo4qrNh69G-Pz1fvTcpBIkQesKSXyEqDiGwVYpVubWYTNEvgWrECBTE1qy5LerjgzvEg/exec"; 

        // ข้อมูล 11 ประเภทการลา
        const LEAVE_TYPES = [
            { code: 'AL', th: 'ลาพักร้อน (Annual Leave)', jp: '年次有給休暇', icon: '🌴', key: 'quotaAL', total: 6 },
            { code: 'PL', th: 'ลากิจส่วนตัว (Personal Leave)', jp: '私用休暇', icon: '💼', key: 'quotaPL', total: 6 },
            { code: 'UP', th: 'ลากิจไม่รับค่าจ้าง (Unpaid Leave)', jp: '無給私用休暇', icon: '⏳', key: 'quotaUP', total: 30 },
            { code: 'SL', th: 'ลาป่วย (Sick Leave)', jp: '病気休暇', icon: '🤒', key: 'quotaSL', total: 30 },
            { code: 'MP', th: 'ลาคลอดบุตร (Maternity Leave)', jp: '産前産後・育児休暇', icon: '👶', key: 'quotaMP', total: 98 },
            { code: 'OL', th: 'ลาอุปสมบท (Ordination Leave)', jp: '出家休暇', icon: '🙏', key: 'quotaOL', total: 15 },
            { code: 'FL', th: 'ลาร่วมงานพิธีศพ (Funeral Leave)', jp: '忌引休暇', icon: '🕊️', key: 'quotaFL', total: 5 },
            { code: 'WL', th: 'ลาพิธีมงคลสมรส (Wedding Leave)', jp: '結婚休暇', icon: '💍', key: 'quotaWL', total: 3 },
            { code: 'MS', th: 'ลารับราชการทหาร (Military Leave)', jp: '兵役召集休暇', icon: '🎖️', key: 'quotaMS', total: 60 },
            { code: 'MF', th: 'ลาทำหมัน (Sterilization Leave)', jp: '避妊手術休暇', icon: '🏥', key: 'quotaMF', total: 1 },
            { code: 'SP', th: 'ลาพักร้อนพิเศษ (Special Leave)', jp: '特別休暇', icon: '⭐', key: 'quotaSP', total: 10 }
        ];

        const translations = {
            th: { title: "ตรวจสอบสิทธิการลาคงเหลือ", back: "เมนูหลัก", empId: "รหัส", dept: "แผนก", subtitle: "สิทธิการลาคงเหลือทั้งหมด (11 ประเภท)", remain: "คงเหลือ", day: "วัน" },
            jp: { title: "休暇残日数確認", back: "メインメニュー", empId: "社員ID", dept: "部署", subtitle: "残存有給休暇一覧", remain: "残り", day: "日" }
        };

        let currentLang = 'th';
        let cachedUserData = null;

        window.onload = function() {
            initLiff();
        };

        function initLiff() {
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        fetchUserData();
                    }
                })
                .catch(err => {
                    console.error("LIFF Init Error:", err);
                    fetchUserData();
                });
        }

        async function fetchUserData() {
            try {
                let userId = liff.isLoggedIn() ? (await liff.getProfile()).userId : "U5ac1f3e292b3bc29539113ef0fe92c52";
                if (liff.isLoggedIn()) {
                    document.getElementById('user-avatar').src = (await liff.getProfile()).pictureUrl || 'https://via.placeholder.com/150';
                }

                const response = await fetch(`${WEB_APP_URL}?action=getUserProfile&userId=${userId}`);
                const res = await response.json();

                if (res.status === 'success') {
                    cachedUserData = res.data;
                    document.getElementById('emp-id').innerText = cachedUserData.empId || '-';
                    document.getElementById('emp-name').innerText = cachedUserData.name || '-';
                    document.getElementById('emp-department').innerText = cachedUserData.department || '-';
                    renderQuotaCards();
                } else {
                    alert(res.message || "ไม่พบข้อมูลพนักงาน");
                }
            } catch (error) {
                console.error("Fetch Error:", error);
            }
        }

        function renderQuotaCards() {
            const container = document.getElementById('quota-cards-container');
            container.innerHTML = '';

            LEAVE_TYPES.forEach(item => {
                const remain = cachedUserData ? parseFloat(cachedUserData[item.key] || 0) : 0;
                const total = item.total;
                const used = Math.max(0, total - remain);
                const percent = Math.min(100, Math.max(0, (used / total) * 100));
                
                const title = currentLang === 'th' ? item.th : item.jp;
                const remainLabel = translations[currentLang].remain;
                const dayLabel = translations[currentLang].day;

                const card = `
                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 flex items-center justify-between space-x-3">
                        <div class="w-11 h-11 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl shrink-0 border border-sky-100">
                            ${item.icon}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold text-slate-800 truncate mb-1">${title}</h4>
                            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                <div class="bg-brand h-full rounded-full" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        <div class="bg-slate-50 rounded-xl px-3 py-1 text-center shrink-0 border border-slate-100 min-w-[70px]">
                            <div class="text-[9px] font-semibold text-slate-400 uppercase leading-none mb-0.5">${remainLabel}</div>
                            <div class="text-lg font-black text-brand leading-tight">${remain}</div>
                            <div class="text-[10px] font-medium text-slate-500 leading-none">${dayLabel}</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('lang-th-btn').className = lang === 'th' ? "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white text-slate-900 shadow-sm" : "px-2.5 py-0.5 rounded-full text-xs font-medium text-white";
            document.getElementById('lang-jp-btn').className = lang === 'jp' ? "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white text-slate-900 shadow-sm" : "px-2.5 py-0.5 rounded-full text-xs font-medium text-white";
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-back').innerText = t.back;
            document.getElementById('txt-emp-id').innerText = t.empId;
            document.getElementById('txt-dept').innerText = t.dept;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            renderQuotaCards();
        }

        function goBack() {
            window.location.href = 'index.html'; // กลับไปหน้าเมนูหลัก
        }
    </script>
</body>
</html>
