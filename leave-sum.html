<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ตรวจสอบสิทธิการลาคงเหลือ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#0056D2', dark: '#003DA5', light: '#EBF3FE' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-bg-header {
            background-image: url('https://lh3.googleusercontent.com/d/1tz1pXJinc7G0pVo3GHDnq6ZKKtrw7tq5');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-start sm:items-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:max-h-[900px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
        
        <!-- HEADER PROFILE -->
        <div class="custom-bg-header text-white px-5 pt-4 pb-6 rounded-b-3xl shadow-lg relative">
            <div class="flex items-center justify-between mb-3">
                <!-- ปุ่มย้อนกลับ -->
                <button onclick="goBack()" class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium bg-black/40 text-white backdrop-blur-md border border-white/20">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>เมนูหลัก</span>
                </button>
            </div>

            <!-- Profile Info -->
            <div class="flex items-center space-x-3">
                <img id="user-avatar" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-full object-cover border-2 border-white/80 shadow-md">
                <div>
                    <h2 id="emp-name" class="text-base font-bold text-white tracking-tight">กำลังโหลด...</h2>
                    <p class="text-xs text-white/90">รหัส: <strong id="emp-id">-</strong> | แผนก: <span id="emp-department">-</span></p>
                </div>
            </div>
        </div>

        <!-- CONTENT: 11 LEAVE QUOTAS -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 pb-8">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">สิทธิการลาคงเหลือทั้งหมด (11 ประเภท)</h3>
                <span class="text-xs text-slate-400">ปี 2026</span>
            </div>

            <!-- Container สำหรับแสดงการ์ดโควตา 11 ประเภท -->
            <div id="quota-cards-container" class="space-y-2.5">
                <div class="text-center py-10 text-slate-400 text-xs">กำลังดึงข้อมูลโควตา...</div>
            </div>
        </div>

    </div>

    <script>
        const LIFF_ID = "2012053598-ClINT0ab";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwo4qrNh69G-Pz1fvTcpBIkQesKSXyEqDiGwVYpVubWYTNEvgWrECBTE1qy5LerjgzvEg/exec"; 

        // ข้อมูล 11 ประเภทการลา (ภาษาไทย)
        const LEAVE_TYPES = [
            { code: 'AL', name: 'ลาพักร้อน (Annual Leave)', icon: '🌴', key: 'quotaAL', totalDefault: 6 },
            { code: 'PL', name: 'ลากิจส่วนตัว (Personal Leave)', icon: '💼', key: 'quotaPL', totalDefault: 6 },
            { code: 'UP', name: 'ลากิจไม่รับค่าจ้าง (Unpaid Leave)', icon: '⏳', key: 'quotaUP', totalDefault: 30 },
            { code: 'SL', name: 'ลาป่วย (Sick Leave)', icon: '🤒', key: 'quotaSL', totalDefault: 30 },
            { code: 'MP', name: 'ลาคลอดบุตร (Maternity Leave)', icon: '👶', key: 'quotaMP', totalDefault: 98 },
            { code: 'OL', name: 'ลาอุปสมบท (Ordination Leave)', icon: '🙏', key: 'quotaOL', totalDefault: 15 },
            { code: 'FL', name: 'ลาร่วมงานพิธีศพ (Funeral Leave)', icon: '🕊️', key: 'quotaFL', totalDefault: 5 },
            { code: 'WL', name: 'ลาพิธีมงคลสมรส (Wedding Leave)', icon: '💍', key: 'quotaWL', totalDefault: 3 },
            { code: 'MS', name: 'ลารับราชการทหาร (Military Leave)', icon: '🎖️', key: 'quotaMS', totalDefault: 60 },
            { code: 'MF', name: 'ลาทำหมัน (Sterilization Leave)', icon: '🏥', key: 'quotaMF', totalDefault: 1 },
            { code: 'SP', name: 'ลาพักร้อนพิเศษ (Special Leave)', icon: '⭐', key: 'quotaSP', totalDefault: 10 }
        ];

        let cachedUserData = null;

        window.onload = function() {
            initLiff();
        };

        function initLiff() {
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        fetchUserData();
                    }
                })
                .catch(err => {
                    console.error("LIFF Init Error:", err);
                    fetchUserData(); 
                });
        }

        async function fetchUserData() {
            try {
                let userId = "U5ac1f3e292b3bc29539113ef0fe92c52"; 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    if (profile.pictureUrl) {
                        document.getElementById('user-avatar').src = profile.pictureUrl;
                    }
                }

                const response = await fetch(`${WEB_APP_URL}?action=getUserProfile&userId=${encodeURIComponent(userId)}`);
                const res = await response.json();

                if (res.status === 'success') {
                    cachedUserData = res.data;
                    document.getElementById('emp-id').innerText = cachedUserData.empId || '-';
                    document.getElementById('emp-name').innerText = cachedUserData.name || '-';
                    document.getElementById('emp-department').innerText = cachedUserData.department || '-';
                    renderQuotaCards();
                } else {
                    alert(res.message || "ไม่พบข้อมูลพนักงานในระบบ");
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('quota-cards-container').innerHTML = `<p class="text-center text-rose-500 text-xs py-4">ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาลองใหม่อีกครั้ง</p>`;
            }
        }

        function renderQuotaCards() {
            const container = document.getElementById('quota-cards-container');
            container.innerHTML = '';

            LEAVE_TYPES.forEach(item => {
                const remain = cachedUserData ? parseFloat(cachedUserData[item.key] || 0) : 0;
                const total = item.totalDefault;
                const used = Math.max(0, total - remain);
                const percent = Math.min(100, Math.max(0, (used / total) * 100));

                const card = `
                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 flex items-center justify-between space-x-3">
                        <div class="w-11 h-11 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl shrink-0 border border-sky-100">
                            ${item.icon}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold text-slate-800 truncate mb-1">${item.name}</h4>
                            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                <div class="bg-brand h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        <div class="bg-slate-50 rounded-xl px-3 py-1 text-center shrink-0 border border-slate-100 min-w-[70px]">
                            <div class="text-[9px] font-semibold text-slate-400 uppercase leading-none mb-0.5">คงเหลือ</div>
                            <div class="text-lg font-black text-brand leading-tight">${remain}</div>
                            <div class="text-[10px] font-medium text-slate-500 leading-none">วัน</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function goBack() {
            window.location.href = 'main-leave.html'; 
        }
    </script>
</body>
</html>
