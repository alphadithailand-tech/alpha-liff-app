<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สรุปวันลาคงเหลือ | Alpha D.I. (Thailand)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #F8FAFC;
    }
    .quota-card {
      transition: all 0.2s ease-in-out;
    }
    .quota-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-24">

  <!-- Loading State -->
  <div id="loading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white">
    <div class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-sm font-medium animate-pulse">กำลังโหลดข้อมูลวันลา...</p>
  </div>

  <!-- Header Section -->
  <header class="bg-slate-900 text-white pt-8 pb-16 px-5 rounded-b-[2.5rem] shadow-lg relative overflow-hidden">
    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="max-w-md mx-auto relative z-10">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-3">
          <img id="userPicture" class="w-12 h-12 rounded-full border-2 border-sky-400 object-cover bg-slate-800" src="https://via.placeholder.com/150" alt="Profile">
          <div>
            <h1 id="userName" class="text-base font-bold leading-tight">กำลังโหลด...</h1>
            <p id="empInfo" class="text-xs text-slate-400">รหัสพนักงาน: - | แผนก: -</p>
          </div>
        </div>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-ping"></span> Active
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto px-4 -mt-10 relative z-20 space-y-4">

    <!-- Primary Summary Card (Annual Leave Featured) -->
    <div class="bg-gradient-to-br from-sky-600 to-blue-700 rounded-2xl p-5 text-white shadow-xl shadow-sky-600/20 border border-sky-400/30">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="text-xs font-semibold text-sky-200 uppercase tracking-wider">วันลาพักร้อนคงเหลือ (AL)</span>
          <h2 class="text-xs text-sky-100 font-light">Annual Leave Remaining</h2>
        </div>
        <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-md flex items-center justify-center text-white">
          <i class="fa-solid me-0 text-lg">🌴</i>
        </div>
      </div>
      <div class="flex items-baseline space-x-2 my-2">
        <span id="alRemainDisplay" class="text-4xl font-extrabold tracking-tight">0</span>
        <span class="text-sm text-sky-200">วัน / Days</span>
      </div>
      <div class="w-full bg-black/20 rounded-full h-2 mb-2 overflow-hidden">
        <div id="alProgressBar" class="bg-white h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <div class="flex justify-between text-xs text-sky-100 font-light">
        <span>ใช้ไปแล้ว: <strong id="alUsedDisplay">0</strong> วัน</span>
        <span>สิทธิ์ทั้งหมด: <strong id="alTotalDisplay">0</strong> วัน</span>
      </div>
    </div>

    <!-- Title Header -->
    <div class="flex justify-between items-center pt-2 px-1">
      <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-list-check text-sky-600"></i> สิทธิ์วันลาทุกประเภท (Leave Quota)
      </h3>
      <span class="text-xs text-slate-400">ปี 2026</span>
    </div>

    <!-- Quota Cards Grid (11 Leave Types) -->
    <div id="quotaGrid" class="space-y-3">
      <!-- Cards will be populated dynamically by JavaScript -->
    </div>

  </main>

  <!-- Bottom Fixed Action Bar -->
  <div class="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-md border-t border-slate-200 p-4 z-40">
    <div class="max-w-md mx-auto">
      <button onclick="openLeaveForm()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white py-3.5 px-4 rounded-xl font-bold text-sm shadow-lg shadow-slate-900/20 flex items-center justify-center space-x-2 transition-all">
        <i class="fa-solid fa-paper-plane text-sky-400"></i>
        <span>ยื่นใบลาหยุด (Apply Leave)</span>
      </button>
    </div>
  </div>

  <script>
    // ⚙️ CONFIGURATION
    const LIFF_ID = 'YOUR_LIFF_ID_HERE'; // ใส่ LIFF ID ของหน้าสรุปโควตา
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxxxxxx/exec'; // URL Web App ของ Apps Script

    // Mapping ประเภทการลา 11 ประเภทตามตาราง Leave_Quota
    const LEAVE_TYPES = [
      { code: 'AL', nameTH: 'ลาพักร้อน', nameEN: 'Annual Leave', icon: '🌴', keyRemain: 'quotaAL', color: 'sky' },
      { code: 'PL', nameTH: 'ลากิจส่วนตัว', nameEN: 'Personal Leave', icon: '💼', keyRemain: 'quotaPL', color: 'indigo' },
      { code: 'UP', nameTH: 'ลากิจไม่รับค่าจ้าง', nameEN: 'Unpaid Leave', icon: '⏳', keyRemain: 'quotaUP', color: 'amber' },
      { code: 'SL', nameTH: 'ลาป่วย', nameEN: 'Sick Leave', icon: '🤒', keyRemain: 'quotaSL', color: 'rose' },
      { code: 'MP', nameTH: 'ลาคลอดบุตร', nameEN: 'Maternity Leave', icon: '👶', keyRemain: 'quotaMP', color: 'pink' },
      { code: 'OL', nameTH: 'ลาอุปสมบท', nameEN: 'Ordination Leave', icon: '🙏', keyRemain: 'quotaOL', color: 'yellow' },
      { code: 'FL', nameTH: 'ลาร่วมงานพิธีศพ', nameEN: 'Funeral Leave', icon: '🕊️', keyRemain: 'quotaFL', color: 'slate' },
      { code: 'WL', nameTH: 'ลาพิธีมงคลสมรส', nameEN: 'Wedding Leave', icon: '💍', keyRemain: 'quotaWL', color: 'purple' },
      { code: 'MS', nameTH: 'ลารับราชการทหาร', nameEN: 'Military Leave', icon: '🎖️', keyRemain: 'quotaMS', color: 'emerald' },
      { code: 'MF', nameTH: 'ลาทำหมัน', nameEN: 'Sterilization Leave', icon: '🏥', keyRemain: 'quotaMF', color: 'teal' },
      { code: 'SP', nameTH: 'ลาพักร้อนพิเศษ', nameEN: 'Special Leave', icon: '⭐', keyRemain: 'quotaSP', color: 'cyan' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initLIFF();
    });

    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        document.getElementById('userPicture').src = profile.pictureUrl || 'https://via.placeholder.com/150';
        
        // ดึงข้อมูลโควตาจาก Apps Script
        await fetchUserQuota(profile.userId, profile.displayName);

      } catch (err) {
        console.error('LIFF Init Error:', err);
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ LINE LIFF: ' + err.message);
        document.getElementById('loading').classList.add('hidden');
      }
    }

    async function fetchUserQuota(userId, displayName) {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getUserProfile&userId=${encodeURIComponent(userId)}`);
        const result = await response.json();

        if (result.status === 'success') {
          const userData = result.data;
          
          // อัปเดต Header Profile
          document.getElementById('userName').textContent = userData.name || displayName;
          document.getElementById('empInfo').textContent = `รหัส: ${userData.empId} | แผนก: ${userData.department}`;

          // อัปเดตการ์ดพักร้อนเด่น (AL)
          const alRemain = parseFloat(userData.quotaAL || 0);
          document.getElementById('alRemainDisplay').textContent = alRemain;

          // สร้าง Cards โควตา 11 ประเภท
          renderQuotaCards(userData);

        } else {
          alert('ไม่พบข้อมูลพนักงาน: ' + result.message);
        }
      } catch (err) {
        console.error('Fetch Quota Error:', err);
        alert('ไม่สามารถดึงข้อมูลวันลาได้ กรุณาลองใหม่อีกครั้ง');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function renderQuotaCards(userData) {
      const container = document.getElementById('quotaGrid');
      container.innerHTML = '';

      LEAVE_TYPES.forEach(item => {
        const remain = parseFloat(userData[item.keyRemain] || 0);
        
        const cardHtml = `
          <div class="quota-card bg-white rounded-xl p-4 shadow-sm border border-slate-200/80 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
              <div class="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center text-xl shadow-inner">
                ${item.icon}
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800">${item.nameTH}</h4>
                <p class="text-[11px] text-slate-400 font-light">${item.nameEN} (${item.code})</p>
              </div>
            </div>
            <div class="text-right">
              <div class="text-lg font-extrabold text-slate-800">${remain} <span class="text-xs font-normal text-slate-400">วัน</span></div>
              <span class="text-[10px] inline-block px-2 py-0.5 rounded-full ${remain > 0 ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-slate-100 text-slate-400'} font-medium">
                ${remain > 0 ? 'คงเหลือ' : 'หมดโควตา'}
              </span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    function openLeaveForm() {
      // ลิงก์ไปหน้าฟอร์มยื่นใบลา leave-form.html
      window.location.href = 'leave-form.html';
    }
  </script>
</body>
</html>
