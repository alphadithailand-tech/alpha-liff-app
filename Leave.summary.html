<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ตรวจสอบสิทธิการลาคงเหลือ | ALPHA D.I.</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
    }
    .lang-btn.active {
      background-color: #FFFFFF;
      color: #0284C7;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .soft-shadow {
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1), 0 8px 10px -6px rgba(2, 132, 199, 0.1);
    }
    .card-shadow {
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-24 select-none">

  <!-- Loading Screen -->
  <div id="loading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex flex-col items-center justify-center text-white">
    <div class="w-10 h-10 border-3 border-white border-t-transparent rounded-full animate-spin mb-3"></div>
    <p class="text-xs font-medium tracking-wide animate-pulse">กำลังโหลดข้อมูลสิทธิการลา...</p>
  </div>

  <!-- HEADER ZONE: MODERN SOFT GRADIENT -->
  <header class="bg-gradient-to-br from-sky-600 via-blue-600 to-indigo-700 text-white pt-6 pb-12 px-5 rounded-b-[2.5rem] soft-shadow relative overflow-hidden">
    <div class="absolute -right-12 -top-12 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -left-12 -bottom-12 w-48 h-48 bg-cyan-400/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="max-w-md mx-auto relative z-10">
      
      <!-- Top Bar: Back Button & Language Switcher -->
      <div class="flex items-center justify-between mb-6">
        <button onclick="goBackHome()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-white/15 text-white backdrop-blur-md border border-white/20 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left"></i>
          <span id="backText">เมนูหลัก</span>
        </button>

        <div class="flex items-center space-x-2">
          <span class="text-[11px] text-sky-100 font-medium">รหัส: <strong id="empIdDisplay" class="text-white">57201</strong></span>
          <!-- Language Switcher -->
          <div class="bg-black/20 p-0.5 rounded-full flex items-center border border-white/15 text-[11px] backdrop-blur-md">
            <button id="btnTH" onclick="switchLanguage('TH')" class="lang-btn px-2.5 py-0.5 rounded-full text-white transition-all active">TH</button>
            <button id="btnJP" onclick="switchLanguage('JP')" class="lang-btn px-2.5 py-0.5 rounded-full text-white/80 transition-all">日本語</button>
          </div>
        </div>
      </div>

      <!-- User Profile Card Row -->
      <div class="flex items-center space-x-4">
        <div class="relative shrink-0">
          <img id="userPicture" class="w-18 h-18 rounded-full border-3 border-white/80 object-cover bg-white/20 shadow-md" src="https://via.placeholder.com/150" alt="Profile">
          <span class="absolute bottom-0 right-0 w-4 h-4 rounded-full bg-emerald-400 border-2 border-white"></span>
        </div>

        <div class="text-white min-w-0 flex-1 space-y-0.5">
          <div class="flex items-center space-x-1.5">
            <h1 id="userName" class="text-base font-bold tracking-tight truncate">PRICHAYA KAEWKLAM</h1>
            <i class="fa-solid fa-circle-check text-cyan-300 text-xs shrink-0"></i>
          </div>
          <p id="empPosition" class="text-xs text-sky-100 font-light truncate">ตำแหน่ง: Factory Manager</p>
          <p id="empDept" class="text-xs text-sky-100/80 font-light truncate">แผนก: Administration</p>
        </div>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER: LEAVE QUOTA CARDS LIST -->
  <main class="max-w-md mx-auto px-4 -mt-6 relative z-25 space-y-3">
    
    <!-- Section Title -->
    <div class="flex items-center justify-between px-1 pt-1">
      <h2 id="sectionTitle" class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center space-x-2">
        <i class="fa-solid fa-chart-pie text-sky-600"></i>
        <span>สิทธิการลาคงเหลือทั้งหมด (Leave Quota Summary)</span>
      </h2>
      <span class="text-[11px] text-slate-400 font-medium">ปี 2026</span>
    </div>

    <!-- Quota List Container -->
    <div id="quotaListContainer" class="space-y-3 pb-6">
      <!-- Dynamic Quota Cards Rendered Here -->
    </div>

  </main>

  <script>
    const LIFF_ID = 'YOUR_LIFF_ID_HERE';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxxxxxx/exec';

    let currentLang = 'TH';
    let globalUserData = null;

    // ข้อมูลโควตาทั้ง 11 ประเภท พร้อมกำหนดสิทธิ์ตั้งต้น (Total Default Quota)
    const LEAVE_CONFIG_LIST = [
      { code: 'AL', th: 'ลาพักร้อน (Annual Leave)', jp: '年次有給休暇', icon: '🌴', key: 'quotaAL', totalDefault: 6 },
      { code: 'PL', th: 'ลากิจส่วนตัว (Personal Leave)', jp: '私用休暇', icon: '💼', key: 'quotaPL', totalDefault: 6 },
      { code: 'UP', th: 'ลากิจไม่รับค่าจ้าง (Unpaid Leave)', jp: '無給私用休暇', icon: '⏳', key: 'quotaUP', totalDefault: 30 },
      { code: 'SL', th: 'ลาป่วย (Sick Leave)', jp: '病気休暇', icon: '🤒', key: 'quotaSL', totalDefault: 30 },
      { code: 'MP', th: 'ลาคลอดบุตร (Maternity Leave)', jp: '産前産後・育児休暇', icon: '👶', key: 'quotaMP', totalDefault: 98 },
      { code: 'OL', th: 'ลาอุปสมบท (Ordination Leave)', jp: '出家休暇', icon: '🙏', key: 'quotaOL', totalDefault: 15 },
      { code: 'FL', th: 'ลาร่วมงานพิธีศพ (Funeral Leave)', jp: '忌引休暇', icon: '🕊️', key: 'quotaFL', totalDefault: 5 },
      { code: 'WL', th: 'ลาพิธีมงคลสมรส (Wedding Leave)', jp: '結婚休暇', icon: '💍', key: 'quotaWL', totalDefault: 3 },
      { code: 'MS', th: 'ลารับราชการทหาร (Military Leave)', jp: '兵役召集休暇', icon: '🎖️', key: 'quotaMS', totalDefault: 60 },
      { code: 'MF', th: 'ลาทำหมัน (Sterilization Leave)', jp: '避妊手術休暇', icon: '🏥', key: 'quotaMF', totalDefault: 1 },
      { code: 'SP', th: 'ลาพักร้อนพิเศษ (Special Leave)', jp: '特別休暇', icon: '⭐', key: 'quotaSP', totalDefault: 10 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initLIFF();
    });

    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        document.getElementById('userPicture').src = profile.pictureUrl || 'https://via.placeholder.com/150';
        await fetchUserQuota(profile.userId, profile.displayName);
      } catch (err) {
        console.error('LIFF Error:', err);
        // Fallback กรณีทดสอบหน้าเว็บ
        fetchUserQuota('U5ac1f3e292b3bc29539113ef0fe92c52', 'PRICHAYA KAEWKLAM');
      }
    }

    async function fetchUserQuota(userId, displayName) {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getUserProfile&userId=${encodeURIComponent(userId)}`);
        const result = await response.json();

        if (result.status === 'success') {
          globalUserData = result.data;
          document.getElementById('userName').textContent = globalUserData.name || displayName;
          document.getElementById('empIdDisplay').textContent = globalUserData.empId || '57201';
          updateHeaderText();
          renderQuotaCards();
        } else {
          alert('ไม่พบข้อมูล: ' + result.message);
        }
      } catch (err) {
        console.error('Fetch Error:', err);
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function updateHeaderText() {
      if (!globalUserData) return;
      const posLabel = currentLang === 'TH' ? 'ตำแหน่ง' : '役職';
      const deptLabel = currentLang === 'TH' ? 'แผนก' : '部署';
      document.getElementById('empPosition').textContent = `${posLabel}: ${globalUserData.position || '-'}`;
      document.getElementById('empDept').textContent = `${deptLabel}: ${globalUserData.department || '-'}`;
      document.getElementById('backText').textContent = currentLang === 'TH' ? 'เมนูหลัก' : 'メインメニュー';
      document.getElementById('sectionTitle').innerHTML = `<i class="fa-solid fa-chart-pie text-sky-600"></i><span>${currentLang === 'TH' ? 'สิทธิการลาคงเหลือทั้งหมด (Leave Quota Summary)' : '残存有給休暇一覧'}</span>`;
    }

    function renderQuotaCards() {
      const container = document.getElementById('quotaListContainer');
      container.innerHTML = '';

      LEAVE_CONFIG_LIST.forEach(item => {
        const remain = globalUserData ? parseFloat(globalUserData[item.key] || 0) : 0;
        const total = item.totalDefault;
        const used = Math.max(0, total - remain);
        const percentUsed = Math.min(100, Math.max(0, (used / total) * 100));

        const titleText = currentLang === 'TH' ? item.th : item.jp;
        const remainLabel = currentLang === 'TH' ? 'คงเหลือ' : '残り';
        const dayLabel = currentLang === 'TH' ? 'วัน' : '日';
        const usedText = currentLang === 'TH' ? `ใช้ไป ${used} / ${total} วัน` : `使用済み ${used} / ${total} 日`;

        const cardHtml = `
          <div class="bg-white rounded-2xl p-4 card-shadow border border-slate-100 flex items-center justify-between space-x-3 transition-all hover:shadow-md">
            
            <!-- ไอคอนฝั่งซ้าย (ทรงกลมละมุน) -->
            <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl shrink-0 border border-sky-100">
              ${item.icon}
            </div>

            <!-- กลาง: ชื่อประเภทลา + สถิติการใช้ + Progress Bar -->
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-slate-800 truncate mb-1">${titleText}</h4>
              <div class="flex justify-between text-[11px] text-slate-400 font-light mb-1.5">
                <span>${usedText}</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div class="bg-sky-500 h-full rounded-full transition-all duration-500" style="width: ${percentUsed}%"></div>
              </div>
            </div>

            <!-- ฝั่งขวา: กล่องตัวเลขคงเหลือเน้นๆ -->
            <div class="bg-slate-50/80 rounded-xl px-3.5 py-1.5 text-center shrink-0 border border-slate-100 min-w-[76px]">
              <div class="text-[9px] font-semibold text-slate-400 tracking-tight leading-none mb-0.5">${remainLabel}</div>
              <div class="text-xl font-black text-sky-600 leading-tight">${remain}</div>
              <div class="text-[10px] font-medium text-slate-500 leading-none">${dayLabel}</div>
            </div>

          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    function switchLanguage(lang) {
      currentLang = lang;
      document.getElementById('btnTH').classList.toggle('active', lang === 'TH');
      document.getElementById('btnJP').classList.toggle('active', lang === 'JP');
      updateHeaderText();
      renderQuotaCards();
    }

    function goBackHome() {
      // ลิงก์กลับไปยังหน้าเมนูหลัก
      window.location.href = 'index.html'; 
    }
  </script>
</body>
</html>
