<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE LIFF App - Alpha D.I.</title>
  <!-- โหลด LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .header {
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      height: 64px;
      border-bottom: 1px solid #e0e0e0;
    }

    .user-name {
      font-size: 15px;
      font-weight: bold;
      color: #333333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }

    .profile-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #e0e0e0;
      border: 1px solid #ddd;
    }

    /* Banner Menu List */
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      background-color: #ffffff;
    }

    /* Slider Container */
    .slider-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .slider-track {
      display: flex;
      transition: transform 0.4s ease-in-out;
      width: 100%;
    }

    .slide-item {
      min-width: 100%;
      box-sizing: border-box;
    }

    .slide-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .banner-btn {
      width: 100%;
      display: block;
      border: none;
      background: none;
      cursor: pointer;
      outline: none;
      padding: 0;
      text-align: center;
    }

    .banner-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ตกแต่งปุ่มเมนูหลักตรงกลางให้ขอบโค้งมน */
    .rounded-banner {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .rounded-banner img {
      border-radius: 16px;
    }

    /* Indicator dots for slider */
    .dots-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      background-color: #ffffff;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #cccccc;
      border-radius: 50%;
      opacity: 0.5;
      cursor: pointer;
      transition: background-color 0.3s, opacity 0.3s;
    }

    .dot.active {
      opacity: 1;
      background-color: #333333;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header ส่วนแสดงชื่อและรูปโปรไฟล์ LINE -->
    <div class="header">
      <div class="user-name" id="displayName">กำลังโหลดข้อมูลโปรไฟล์...</div>
      <img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="pictureUrl" style="display:none;">
    </div>

    <!-- รายการแบนเนอร์และเมนูหลัก -->
    <div class="menu-container">
      
      <!-- News Image Slider (เลื่อนได้ 3 ภาพอัตโนมัติ / ปัดได้) -->
      <div class="slider-wrapper" id="sliderWrapper">
        <div class="slider-track" id="sliderTrack">
          <!-- ภาพที่ 1 -->
          <div class="slide-item">
            <img src="https://lh3.googleusercontent.com/d/1Vd05uDkD7ty3dXa8BWF6e4UZBPnHghdj" alt="ข่าวสารประชาสัมพันธ์ 1">
          </div>
          <!-- ภาพที่ 2 (สามารถเปลี่ยนลิงก์รูปภาพ Google Drive ตรงนี้ได้เลยครับ) -->
          <div class="slide-item">
            <img src="https://lh3.googleusercontent.com/d/1Vd05uDkD7ty3dXa8BWF6e4UZBPnHghdj" alt="ข่าวสารประชาสัมพันธ์ 2">
          </div>
          <!-- ภาพที่ 3 (สามารถเปลี่ยนลิงก์รูปภาพ Google Drive ตรงนี้ได้เลยครับ) -->
          <div class="slide-item">
            <img src="https://lh3.googleusercontent.com/d/1Vd05uDkD7ty3dXa8BWF6e4UZBPnHghdj" alt="ข่าวสารประชาสัมพันธ์ 3">
          </div>
        </div>
      </div>

      <!-- จุดสไลด์ (Dots) 3 จุด -->
      <div class="dots-container" id="dotsContainer">
        <div class="dot active" onclick="currentSlide(0)"></div>
        <div class="dot" onclick="currentSlide(1)"></div>
        <div class="dot" onclick="currentSlide(2)"></div>
      </div>

      <!-- 1. ปุ่มระบบการลาหยุดของพนักงาน (ขอบมน) -->
      <button class="banner-btn rounded-banner" onclick="window.location.href='leave-terms.html'">
        <img src="https://lh3.googleusercontent.com/d/1KoanDHszHb1jpiFcCNB_UtvldAzeivN7" alt="ระบบการลาหยุดของพนักงาน">
      </button>

      <!-- 2. ปุ่มตรวจสอบอายุงานและผลประโยชน์ (ขอบมน) -->
      <button class="banner-btn rounded-banner" onclick="openLink('check_benefit')">
        <img src="https://lh3.googleusercontent.com/d/1EtTTuYlvQJ2TAYCij9Jr3n15JTpMUJJj" alt="ตรวจสอบอายุงานและผลประโยชน์">
      </button>

      <!-- 3. ปุ่มดาวน์โหลดเอกสารต่างๆ (ขอบมน) -->
      <button class="banner-btn rounded-banner" onclick="openLink('download_banner')">
        <img src="https://lh3.googleusercontent.com/d/1kbKqVY4VjHmIHUmksjJnbOQOTKPFQAYO" alt="ดาวน์โหลดเอกสารต่างๆ">
      </button>

      <!-- 4. ปุ่มติดต่อผู้ดูแล (ขอบมน) -->
      <button class="banner-btn rounded-banner" onclick="openLink('contact_admin')">
        <img src="https://lh3.googleusercontent.com/d/1DRopnuglTV32GPY5rIcrF6vN6xBpyaa3" alt="ติดต่อผู้ดูแล">
      </button>

      <!-- Footer Banner (คนของเราคือพลังขององค์กร) -->
      <div class="banner-btn" style="margin-top: 6px;">
        <img src="https://lh3.googleusercontent.com/d/1ok2FxA1AQ5RaaCjCdodbJlZ3ObjrMNyV" alt="คนของเราคือพลังขององค์กร">
      </div>

    </div>
  </div>

  <script>
    // LIFF ID ของคุณ
    const MY_LIFF_ID = '2012053598-ClINT0ab';

    document.addEventListener("DOMContentLoaded", function() {
      initializeLiff(MY_LIFF_ID);
      initSlider();
    });

    // --- ส่วนจัดการ Image Slider ---
    let currentIndex = 0;
    const totalSlides = 3;
    let slideInterval;

    function initSlider() {
      const wrapper = document.getElementById('sliderWrapper');
      
      // ตั้งเวลาเลื่อนภาพอัตโนมัติทุกๆ 5 วินาที
      startAutoSlide();

      // รองรับการปัดหน้าจอ (Touch Swipe) บนมือถือ
      let touchStartX = 0;
      let touchEndX = 0;

      wrapper.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        stopAutoSlide(); // หยุดชั่วคราวเมื่อผู้ใช้กำลังสัมผัส
      }, {passive: true});

      wrapper.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
        startAutoSlide(); // เริ่มจับเวลาต่อหลังปัดเสร็จ
      }, {passive: true});
    }

    function handleSwipe() {
      if (touchEndX < touchStartX - 50) {
        // ปัดซ้าย -> ไปภาพถัดไป
        nextSlide();
      }
      if (touchEndX > touchStartX + 50) {
        // ปัดขวา -> ไปภาพก่อนหน้า
        prevSlide();
      }
    }

    function showSlide(index) {
      if (index >= totalSlides) {
        currentIndex = 0;
      } else if (index < 0) {
        currentIndex = totalSlides - 1;
      } else {
        currentIndex = index;
      }

      const track = document.getElementById('sliderTrack');
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      // อัปเดตจุด Indicator Dots
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function nextSlide() {
      showSlide(currentIndex + 1);
    }

    function prevSlide() {
      showSlide(currentIndex - 1);
    }

    function currentSlide(index) {
      showSlide(index);
      stopAutoSlide();
      startAutoSrcTimer();
    }

    function startAutoSlide() {
      slideInterval = setInterval(() => {
        nextSlide();
      }, 5000); // ทุกๆ 5 วินาที
    }

    function stopAutoSlide() {
      clearInterval(slideInterval);
    }

    function startAutoSrcTimer() {
      startAutoSlide();
    }

    // --- ส่วนจัดการ LINE LIFF Profile ---
    function initializeLiff(liffId) {
      liff.init({ liffId: liffId })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            getUserProfile();
          }
        })
        .catch((err) => {
          console.error('LIFF Initialization failed', err);
          document.getElementById('displayName').innerText = 'ไม่สามารถเชื่อมต่อ LIFF ได้';
        });
    }

    function getUserProfile() {
      liff.getProfile()
        .then((profile) => {
          if (profile.displayName) {
            document.getElementById('displayName').innerText = profile.displayName;
          }
          if (profile.pictureUrl) {
            const imgEl = document.getElementById('pictureUrl');
            imgEl.src = profile.pictureUrl;
            imgEl.style.display = 'block';
          }
        })
        .catch((err) => {
          console.error('Error getting profile', err);
          document.getElementById('displayName').innerText = 'ดึงข้อมูลโปรไฟล์ไม่สำเร็จ';
        });
    }

    function openLink(menuType) {
      switch(menuType) {
        case 'leave_system':
          alert('เปิดหน้า: ระบบการลาหยุดของพนักงาน');
          break;
        case 'check_benefit':
          alert('เปิดหน้า: ตรวจสอบอายุงานและผลประโยชน์');
          break;
        case 'download_banner':
          alert('เปิดหน้า:ดาวน์โหลดเอกสารต่างๆ');
          break;
        case 'contact_admin':
          alert('เปิดหน้า: ติดต่อผู้ดูแล');
          break;
      }
    }
  </script>
</body>
</html>
