<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนพนักงาน (LINE LIFF)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex justify-center items-start py-4 sm:py-8 px-2 sm:px-4">

    <!-- Container หลักของหน้า LIFF -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">

        <!-- ส่วนหัว (Header สีน้ำเงินเข้ม) -->
        <div class="bg-[#1e3a8a] text-white p-6 relative">
            <div class="flex justify-between items-start">
                <div>
                    <!-- Badge ตรวจสอบความปลอดภัย -->
                    <div class="inline-flex items-center gap-1.5 bg-blue-900/60 border border-blue-400/30 px-2.5 py-1 rounded-full text-xs font-medium text-blue-200 mb-3">
                        <i class="fa-solid fa-shield-halved text-blue-300"></i> Secure LINE Verification
                    </div>
                    <!-- หัวข้อหลัก -->
                    <h1 class="text-2xl font-bold tracking-tight mb-1">ลงทะเบียนพนักงาน</h1>
                    <p class="text-xs sm:text-sm text-blue-200 font-light">กรอกข้อมูลเพื่อเชื่อมโยง LINE ID เข้าระบบงานบริษัท</p>
                </div>
                <!-- ไอคอนโปรไฟล์มุมขวาบน -->
                <div class="w-12 h-12 bg-blue-900/80 border border-blue-400/20 rounded-full flex items-center justify-center text-blue-200 shadow-inner">
                    <i class="fa-solid fa-user-plus text-lg"></i>
                </div>
            </div>
        </div>

        <!-- ส่วนเนื้อหาฟอร์ม -->
        <div class="p-5 sm:p-6 space-y-5 bg-white">

            <!-- การ์ดสถานะการเชื่อมต่อ LINE -->
            <div class="border border-blue-200 rounded-xl p-4 bg-gradient-to-br from-blue-50/50 to-indigo-50/30 relative">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2 text-xs font-semibold text-slate-700">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block"></span>
                        สถานะการเชื่อมต่อ LINE
                    </div>
                    <!-- ป้ายสถานะเชื่อมต่อแล้ว -->
                    <span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-medium px-2.5 py-1 rounded-full">
                        <i class="fa-solid fa-circle-check text-emerald-500"></i> เชื่อมต่อบัญชีแล้ว
                    </span>
                </div>

                <!-- ข้อมูลโปรไฟล์ LINE -->
                <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                    <div class="relative">
                        <img id="lineProfileImg" src="https://placehold.co/100x100/3b82f6/ffffff?text=LINE" alt="LINE Profile" class="w-12 h-12 rounded-lg object-cover border border-slate-200">
                        <span class="absolute -bottom-1 -right-1 bg-emerald-500 text-white rounded-full p-0.5 text-[10px] w-4 h-4 flex items-center justify-center border-2 border-white">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </div>
                    <div class="overflow-hidden flex-1">
                        <p class="text-xs text-slate-400">ชื่อบัญชี LINE</p>
                        <h2 id="lineDisplayName" class="text-sm font-bold text-slate-800 truncate">สมชาย ใจดี (Simulation Test)</h2>
                        <div class="flex items-center gap-1 mt-1 bg-slate-100 px-2 py-0.5 rounded text-[11px] text-slate-600 w-fit border border-slate-200">
                            <i class="fa-solid fa-key text-blue-600 text-[10px]"></i>
                            <span id="lineUserId" class="font-mono text-slate-500">Uk79eJ619wgcuwc</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ฟอร์มกรอกข้อมูล -->
            <form id="registerForm" onsubmit="handleSubmit(event)" class="space-y-4">
                
                <!-- รหัสพนักงาน -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-id-badge text-blue-600 mr-1"></i> รหัสพนักงาน <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="empId" required placeholder="เช่น 57200" 
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-slate-800 placeholder-slate-400">
                </div>

                <!-- ชื่อ - นามสกุล -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-user text-blue-600 mr-1"></i> ชื่อ - นามสกุล (ภาษาอังกฤษ) <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="fullName" required placeholder="นายสมชาย ใจดี" 
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-slate-800 placeholder-slate-400">
                </div>

                <!-- แผนก / ฝ่าย -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-sitemap text-blue-600 mr-1"></i> แผนก / ฝ่าย <span class="text-red-500">*</span>
                    </label>
                    <select id="department" required 
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-slate-800">
                        <option value="" disabled selected>-- เลือกแผนก / ฝ่าย --</option>
                        <option value="IT">เทคโนโลยีสารสนเทศ (IT)</option>
                        <option value="HR">ทรัพยากรบุคคล (HR)</option>
                        <option value="Marketing">การตลาดและการขาย (Marketing & Sales)</option>
                        <option value="Accounting">บัญชีและการเงิน (Accounting & Finance)</option>
                        <option value="Operations">จัดซื้อจัดจ้าง (Percument)</option>
                        <option value="Operations">พนักงานฝ่ายผลิต (Operations)</option>
                        <option value="Operations">สำนักงาน (Officer)</option>
                    </select>
                </div>

                <!-- เบอร์โทรศัพท์ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-phone text-blue-600 mr-1"></i> เบอร์โทรศัพท์ <span class="text-red-500">*</span>
                    </label>
                    <input type="tel" id="phone" required placeholder="0812345678" pattern="[0-9]{9,10}"
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-slate-800 placeholder-slate-400">
                </div>

                <!-- อีเมลบริษัท -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">
                        <i class="fa-solid fa-envelope text-blue-600 mr-1"></i> อีเมลบริษัท <span class="text-red-500">*</span>
                    </label>
                    <input type="email" id="email" required placeholder="employee@company.com" 
                        class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-slate-800 placeholder-slate-400">
                </div>

                <!-- ปุ่มยืนยันการลงทะเบียน -->
                <div class="pt-3">
                    <button type="submit" 
                        class="w-full bg-[#1e3a8a] hover:bg-blue-900 active:scale-[0.99] text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-2 text-sm sm:text-base cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i> ยืนยันการลงทะเบียน
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Modal แจ้งเตือนแทน alert() -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center transform transition-all">
            <div id="modalIcon" class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"></div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800 mb-1"></h3>
            <p id="modalMessage" class="text-xs text-slate-600 mb-6 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-[#1e3a8a] text-white py-2.5 rounded-xl font-medium text-sm hover:bg-blue-950 transition">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        // เริ่มต้นใช้งาน LINE LIFF SDK เมื่อโหลดหน้าเว็บเสร็จ
        window.addEventListener('load', async () => {
            const liffId = "YOUR_LIFF_ID"; // แทนที่ด้วย LIFF ID ของคุณ
            try {
                // หากทดสอบในเบราว์เซอร์ปกติ จะใช้ข้อมูลจำลอง (Simulation Mode)
                if (!window.liff) return;
                
                // เริ่มต้น LIFF (ถ้าต้องการใช้ LIFF จริงให้เปิดคอมเมนต์ด้านล่างและใส่ LIFF ID)
                // await liff.init({ liffId: liffId });
                
                // if (!liff.isLoggedIn()) {
                //     liff.login();
                //     return;
                // }

                // const profile = await liff.getProfile();
                // document.getElementById('lineDisplayName').innerText = profile.displayName;
                // document.getElementById('lineUserId').innerText = profile.userId;
                // if(profile.pictureUrl) {
                //     document.getElementById('lineProfileImg').src = profile.pictureUrl;
                // }
            } catch (error) {
                console.warn("LIFF Initialization running in simulation mode:", error);
            }
        });

        // ฟังก์ชันจัดการเมื่อกดปุ่มยืนยันการลงทะเบียน
        function handleSubmit(event) {
            event.preventDefault();
            
            const empId = document.getElementById('empId').value;
            const fullName = document.getElementById('fullName').value;
            const department = document.getElementById('department').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const lineUserId = document.getElementById('lineUserId').innerText;

            // แพ็กเกจข้อมูลที่เตรียมส่งไป Backend หรือ Google Sheets / Database
            const registrationData = {
                empId,
                fullName,
                department,
                phone,
                email,
                lineUserId
            };

            console.log("Submitted Data:", registrationData);

            // แสดงหน้าต่างสำเร็จ
            showModal(
                'success', 
                'ลงทะเบียนสำเร็จ!', 
                `ระบบได้บันทึกข้อมูลของ ${fullName} และเชื่อมโยง LINE ID เรียบร้อยแล้ว`
            );
        }

        // ฟังก์ชันควบคุม Modal แสดงผลสวยงาม (ปฏิบัติตามกฎห้ามใช้ alert/confirm)
        function showModal(type, title, message) {
            const modal = document.getElementById('customModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (type === 'success') {
                modalIcon.className = "w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl";
                modalIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                modalIcon.className = "w-14 h-14 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-2xl";
                modalIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
            // หากใช้งานใน LINE LIFF จริง สามารถสั่งปิดหน้า LIFF ได้ด้วยคำสั่ง:
            // if (window.liff && liff.isInClient()) { liff.closeWindow(); }
        }
    </script>
</body>
</html>
