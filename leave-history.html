<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ตรวจสอบประวัติการลาย้อนหลัง</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#0056D2', dark: '#003DA5', light: '#EBF3FE' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-bg-header {
            background-image: url('https://lh3.googleusercontent.com/d/1tz1pXJinc7G0pVo3GHDnq6ZKKtrw7tq5');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-start sm:items-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:max-h-[900px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
        
        <!-- HEADER PROFILE -->
        <div class="custom-bg-header text-white px-5 pt-4 pb-6 rounded-b-3xl shadow-lg relative">
            <div class="flex items-center justify-between mb-3">
                <button onclick="goBack()" class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium bg-black/40 text-white backdrop-blur-md border border-white/20">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>เมนูหลัก</span>
                </button>
            </div>

            <div class="flex items-center space-x-3">
                <img id="user-avatar" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-full object-cover border-2 border-white/80 shadow-md">
                <div>
                    <h2 id="emp-name" class="text-base font-bold text-white tracking-tight">กำลังโหลด...</h2>
                    <p class="text-xs text-white/90">รหัส: <strong id="emp-id">-</strong> | แผนก: <span id="emp-department">-</span></p>
                </div>
            </div>
        </div>

        <!-- CONTENT: LEAVE HISTORY LIST -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 pb-8">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">ประวัติการยื่นใบลาทั้งหมด</h3>
                <span id="history-count" class="text-xs text-slate-400">0 รายการ</span>
            </div>

            <!-- Container แสดงรายการประวัติการลา -->
            <div id="history-container" class="space-y-3">
                <div class="text-center py-12 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner animate-spin text-lg mb-2 text-brand"></i>
                    <p>กำลังโหลดประวัติการลา...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL แนบหลักฐานย้อนหลัง -->
    <div id="upload-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-5 max-w-xs w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-slate-800 text-sm">แนบหลักฐานย้อนหลัง</h3>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-2">
                <p class="text-xs text-slate-500">เลือกไฟล์เอกสาร หรือรูปภาพใบรับรองแพทย์/หลักฐานประกอบการลา</p>
                <input type="file" id="file-input" accept="image/*,.pdf" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand/10 file:text-brand hover:file:bg-brand/20">
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeUploadModal()" class="w-1/2 py-2 rounded-xl text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200">ยกเลิก</button>
                <button onclick="submitLateAttachment()" id="btn-upload-submit" class="w-1/2 py-2 rounded-xl text-xs font-medium text-white bg-brand hover:bg-brand-dark">อัปโหลด</button>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2012053598-ClINT0ab";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwo4qrNh69G-Pz1fvTcpBIkQesKSXyEqDiGwVYpVubWYTNEvgWrECBTE1qy5LerjgzvEg/exec"; 

        let selectedRequestId = '';

        window.onload = function() {
            initLiff();
        };

        function initLiff() {
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        fetchLeaveHistory();
                    }
                })
                .catch(err => {
                    console.error("LIFF Init Error:", err);
                    fetchLeaveHistory(); 
                });
        }

        async function fetchLeaveHistory() {
            try {
                let userId = "U5ac1f3e292b3bc29539113ef0fe92c52"; 
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    if (profile.pictureUrl) {
                        document.getElementById('user-avatar').src = profile.pictureUrl;
                    }
                }

                const profileRes = await fetch(`${WEB_APP_URL}?action=getUserProfile&userId=${encodeURIComponent(userId)}`);
                const profileJson = await profileRes.json();
                if (profileJson.status === 'success') {
                    const data = profileJson.data;
                    document.getElementById('emp-id').innerText = data.empId || '-';
                    document.getElementById('emp-name').innerText = data.name || '-';
                    document.getElementById('emp-department').innerText = data.department || '-';
                }

                const response = await fetch(`${WEB_APP_URL}?action=getLeaveHistory&userId=${encodeURIComponent(userId)}`);
                const res = await response.json();

                if (res.status === 'success') {
                    renderHistoryList(res.data);
                } else {
                    document.getElementById('history-container').innerHTML = `<p class="text-center text-slate-400 text-xs py-10">ยังไม่มีประวัติการยื่นใบลา</p>`;
                }
            } catch (error) {
                console.error("Fetch History Error:", error);
                document.getElementById('history-container').innerHTML = `<p class="text-center text-rose-500 text-xs py-10">ไม่สามารถเชื่อมต่อข้อมูลได้ กรุณาลองใหม่อีกครั้ง</p>`;
            }
        }

        function renderHistoryList(historyList) {
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            document.getElementById('history-count').innerText = `${historyList.length} รายการ`;

            if (historyList.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 text-xs py-10">ยังไม่มีประวัติการยื่นใบลา</p>`;
                return;
            }

            historyList.forEach(item => {
                let statusBadge = '';
                let statusBg = '';
                if (item.status === 'Approved') {
                    statusBadge = 'อนุมัติแล้ว';
                    statusBg = 'bg-emerald-50 text-emerald-600 border-emerald-200';
                } else if (item.status === 'Rejected') {
                    statusBadge = 'ไม่อนุมัติ';
                    statusBg = 'bg-rose-50 text-rose-600 border-rose-200';
                } else {
                    statusBadge = 'รออนุมัติ';
                    statusBg = 'bg-amber-50 text-amber-600 border-amber-200';
                }

                // เงื่อนไขตรวจสอบการแสดงผลหลักฐาน
                let attachContent = '';
                const hasAttachment = item.attachmentUrl && item.attachmentUrl.startsWith('http');

                if (hasAttachment) {
                    attachContent = `<a href="${item.attachmentUrl}" target="_blank" class="text-sky-600 underline text-[11px] font-medium"><i class="fa-solid fa-paperclip mr-1"></i>ดูหลักฐานแนบ</a>`;
                } else {
                    attachContent = `<button onclick="openUploadModal('${item.requestId}')" class="px-2.5 py-1 rounded-lg bg-brand/10 text-brand hover:bg-brand/20 font-semibold text-[11px] transition-all"><i class="fa-solid fa-cloud-arrow-up mr-1"></i>แนบหลักฐานย้อนหลัง</button>`;
                }

                const card = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-800">${item.leaveType}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${statusBg}">${statusBadge}</span>
                        </div>
                        <div class="text-xs text-slate-600 space-y-1">
                            <p><i class="fa-regular fa-calendar text-brand mr-1.5"></i><strong>วันที่ลา:</strong> ${item.startDate} ถึง ${item.endDate} (${item.totalDays} วัน)</p>
                            <p><i class="fa-regular fa-comment-dots text-brand mr-1.5"></i><strong>เหตุผล:</strong> ${item.reason || '-'}</p>
                        </div>
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
                            <span class="text-slate-400">ยื่นเมื่อ: ${item.timestamp}</span>
                            <div>${attachContent}</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function openUploadModal(reqId) {
            selectedRequestId = reqId;
            document.getElementById('file-input').value = '';
            document.getElementById('upload-modal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
        }

        async function submitLateAttachment() {
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('กรุณาเลือกไฟล์หลักฐานที่ต้องการอัปโหลด');
                return;
            }

            const file = fileInput.files[0];
            const btnSubmit = document.getElementById('btn-upload-submit');
            btnSubmit.innerText = 'กำลังส่ง...';
            btnSubmit.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result;
                const payload = {
                    action: 'uploadLateAttachment',
                    requestId: selectedRequestId,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                try {
                    const res = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();

                    if (result.status === 'success') {
                        alert('แนบหลักฐานย้อนหลังเรียบร้อยแล้ว');
                        closeUploadModal();
                        fetchLeaveHistory(); // โหลดรายการใหม่
                    } else {
                        alert('เกิดข้อผิดพลาด: ' + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('ไม่สามารถอัปโหลดไฟล์ได้ กรุณาลองใหม่อีกครั้ง');
                } finally {
                    btnSubmit.innerText = 'อัปโหลด';
                    btnSubmit.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }

        function goBack() {
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
