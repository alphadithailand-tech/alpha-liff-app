<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยื่นคำขอลาหยุด</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f4f9;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Container Card -->
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-lg border border-blue-100 overflow-hidden flex flex-col p-6 my-6">
        
        <h1 class="text-xl font-bold text-slate-800 mb-1 text-center">แบบฟอร์มยื่นใบลา</h1>
        <p class="text-xs text-slate-500 mb-6 text-center">กรุณากรอกข้อมูล เลือกช่วงเวลา และแนบหลักฐาน (ถ้ามี)</p>

        <!-- Form -->
        <form id="leaveForm" onsubmit="openSummaryModal(event)" class="space-y-4">
            
            <!-- ประเภทการลา -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">ประเภทการลา</label>
                <select id="leaveType" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:border-blue-500">
                    <option value="">-- เลือกประเภทการลา --</option>
                    <option value="ลาพักร้อน">ลาพักร้อน</option>
                    <option value="ลากิจ">ลากิจ</option>
                    <option value="ลากิจ ไม่รับค่าจ้าง">ลากิจ ไม่รับค่าจ้าง</option>
                    <option value="ลาป่วย">ลาป่วย</option>
                    <option value="ลาคลอดบุตร">ลาคลอดบุตร</option>
                    <option value="ลาอุปสมบท">ลาอุปสมบท</option>
                    <option value="ลาร่วมงานพิธีศพ">ลาร่วมงานพิธีศพ</option>
                    <option value="ลาพักร้อนพิเศษ">ลาพักร้อนพิเศษ</option>
                </select>
            </div>

            <!-- ส่วนเลือกช่วงเวลาการลา (หลายช่วง) -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-slate-700">ช่วงวันที่ต้องการลา</label>
                    <button type="button" onclick="addLeavePeriod()" class="text-xs text-blue-600 font-semibold hover:underline">+ เพิ่มช่วงเวลาลา</button>
                </div>
                
                <div id="leavePeriodsContainer" class="space-y-3">
                    <!-- รายการช่วงเวลา (ชุดแรก) -->
                    <div class="leave-period-item bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2 relative">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] text-slate-500 mb-1">วันที่เริ่มต้น/วันที่ลา</label>
                                <input type="date" required class="leave-date w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] text-slate-500 mb-1">ช่วงเวลา</label>
                                <select class="leave-session w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none">
                                    <option value="เต็มวัน">เต็มวัน</option>
                                    <option value="ครึ่งวันเช้า">ครึ่งวันเช้า</option>
                                    <option value="ครึ่งวันบ่าย">ครึ่งวันบ่าย</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- เหตุผลการลา -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">เหตุผลการลา</label>
                <textarea id="leaveReason" rows="3" required placeholder="ระบุเหตุผลความจำเป็น..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <!-- แนบหลักฐานประกอบการลา -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">แนบหลักฐานประกอบการลา (ถ้ามี)</label>
                <input type="file" id="leaveFile" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 cursor-pointer bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-[10px] text-slate-400 mt-1">รองรับไฟล์รูปภาพ (JPG, PNG) หรือ PDF</p>
            </div>

            <!-- ปุ่มกดส่งคำขอ -->
            <div class="pt-2">
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl transition text-sm shadow-md shadow-blue-200">
                    ส่งใบขออนุมัติลา
                </button>
            </div>
        </form>
    </div>

    <!-- POP-UP สรุปข้อมูลการลา -->
    <div id="summaryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-slate-100 space-y-4">
            <h3 class="text-lg font-bold text-slate-800 text-center">📄 สรุปข้อมูลการขอลา</h3>
            <p class="text-xs text-slate-500 text-center -mt-2">กรุณาตรวจสอบความถูกต้องก่อนกดยืนยัน</p>

            <div class="bg-slate-50 p-4 rounded-2xl space-y-2 text-xs border border-slate-100">
                <div><span class="text-slate-400">ประเภทการลา:</span> <span id="sumType" class="font-semibold text-slate-700"></span></div>
                <div><span class="text-slate-400">ช่วงเวลาที่ลา:</span>
                    <ul id="sumPeriods" class="list-disc list-inside mt-1 font-semibold text-slate-700 space-y-1"></ul>
                </div>
                <div><span class="text-slate-400">เหตุผลการลา:</span> <span id="sumReason" class="font-semibold text-slate-700"></span></div>
                <div><span class="text-slate-400">หลักฐานที่แนบ:</span> <span id="sumFile" class="font-semibold text-slate-700"></span></div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button type="button" onclick="closeSummaryModal()" class="py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-2xl transition text-xs">
                    แก้ไขข้อมูล
                </button>
                <button type="button" onclick="confirmSubmit()" class="py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl transition text-xs shadow-md shadow-blue-200">
                    ยืนยันส่งใบลา
                </button>
            </div>
        </div>
    </div>

    <script>
        // ฟังก์ชันเพิ่มช่วงเวลาการลา
        function addLeavePeriod() {
            const container = document.getElementById('leavePeriodsContainer');
            const periodItem = document.createElement('div');
            periodItem.className = "leave-period-item bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2 relative";
            periodItem.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-semibold text-blue-600">ช่วงเวลาเพิ่มเติม</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-xs text-rose-500 font-semibold hover:underline">ลบ</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">วันที่</label>
                        <input type="date" required class="leave-date w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">ช่วงเวลา</label>
                        <select class="leave-session w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none">
                            <option value="เต็มวัน">เต็มวัน</option>
                            <option value="ครึ่งวันเช้า">ครึ่งวันเช้า</option>
                            <option value="ครึ่งวันบ่าย">ครึ่งวันบ่าย</option>
                        </select>
                    </div>
                </div>
            `;
            container.appendChild(periodItem);
        }

        // เปิด Pop-up สรุปข้อมูล
        function openSummaryModal(event) {
            event.preventDefault();

            // ดึงค่าประเภทการลาและเหตุผล
            const type = document.getElementById('leaveType').value;
            const reason = document.getElementById('leaveReason').value;
            const fileInput = document.getElementById('leaveFile');
            const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : 'ไม่มีไฟล์แนบ';

            document.getElementById('sumType').innerText = type;
            document.getElementById('sumReason').innerText = reason;
            document.getElementById('sumFile').innerText = fileName;

            // รวบรวมช่วงเวลาทั้งหมด
            const dates = document.querySelectorAll('.leave-date');
            const sessions = document.querySelectorAll('.leave-session');
            const sumPeriodsList = document.getElementById('sumPeriods');
            sumPeriodsList.innerHTML = '';

            for (let i = 0; i < dates.length; i++) {
                if (dates[i].value) {
                    const li = document.createElement('li');
                    li.innerText = `${dates[i].value} (${sessions[i].value})`;
                    sumPeriodsList.appendChild(li);
                }
            }

            // แสดง Modal
            document.getElementById('summaryModal').classList.remove('hidden');
            document.getElementById('summaryModal').classList.add('flex');
        }

        // ปิด Pop-up (ปุ่มแก้ไข)
        function closeSummaryModal() {
            document.getElementById('summaryModal').classList.remove('flex');
            document.getElementById('summaryModal').classList.add('hidden');
        }

        // ยืนยันส่งข้อมูลจริง
        function confirmSubmit() {
            alert('ส่งใบขออนุมัติลาเรียบร้อยแล้ว!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
